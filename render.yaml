  #   disk:
  #     name: api-drama-data
  #     mountPath: /srv/data
  #   # Command override cho worker (cần thêm entrypoint hoặc script)
  #   startCommand: python -m app.episode_cache.worker

databases: []  # Không dùng managed Postgres, dùng SQLite trên disk