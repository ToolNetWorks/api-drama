  #   plan: free
  #   envVars:  # cùng env vars với web service
  #     - key: RAPIDAPI_REELSHORT_HOST
  #       sync: false
  #     - key: RAPIDAPI_REELSHORT_KEY_1
  #       sync: false
  #     - key: RAPIDAPI_REELSHORT_KEY_2
  #       sync: false
  #     - key: TOOLNET_MASTER_KEY
  #       sync: false
  #     - key: DB_PATH
  #       value: /srv/data/reelshort.sqlite3
  #     - key: LOG_FILE
  #       value: /srv/logs/episode-cache.log
